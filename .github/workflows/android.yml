name: ChitChat Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run test:sql
      - run: npm run check:functions
      - name: Write public app configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          fields = ['SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY','FIREBASE_API_KEY','FIREBASE_APP_ID','FIREBASE_MESSAGING_SENDER_ID','FIREBASE_PROJECT_ID']
          config = {k: os.environ.get(k, '') for k in fields}
          config['FIREBASE_ENABLED'] = str(all(config[k] for k in fields if k.startswith('FIREBASE_'))).lower()
          with open('config/build.json','w') as out: json.dump(config,out)
          PY
      - run: flutter build apk --debug --target-platform android-arm64 --dart-define-from-file=config/build.json
      - uses: actions/upload-artifact@v6
        with:
          name: ChitChat-S23-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
